steps:
  - name: 'Tests and build'
    image: python:3.13-slim-bookworm
    environment:
      XDG_CACHE_HOME: tmp/pip
    commands:
      - pip3 install poetry licensecheck
      - poetry self add poetry-plugin-export
      - poetry install
      - poetry run pytest
      - poetry build
      - poetry export -f requirements.txt --output dist/requirements.txt
      - >
        licensecheck --format ansi
        --only-licenses apache bsd mit mpl python
        --fail-licenses gpl
        --show-only-failing
        --zero

  - name: 'Build App docker'
    image: woodpeckerci/plugin-docker-buildx:6.0
    settings:
      registry: registry.b7w.me
      repo: registry.b7w.me/b7w/socks5-tune
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: .ci/app.dockerfile
      tags: master
      bip: 173.17.1.3/24  # For docker in docker
    when:
      branch:
        - master


  - name: 'Build Migrations docker'
    image: woodpeckerci/plugin-docker-buildx:6.0
    settings:
      registry: registry.b7w.me
      repo: registry.b7w.me/b7w/socks5-tune-migrattions
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: .ci/migrations.dockerfile
      tags: master
      bip: 173.17.1.3/24  # For docker in docker
    when:
      branch:
        - master
